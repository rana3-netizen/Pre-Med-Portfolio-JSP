<style id="site-style">
/* Layout: a MacBook desktop. Lock screen first; then menu bar with status items, wallpaper, draggable desktop icons, animated windows (Finder, Notes, Calendar, System Settings, Preview), magnifying dock, Control Center and Notification Center. Phones get full-screen windows. */
:root {
  --win: #ffffff;
  --win-2: #f7f6f4;
  --vib: rgba(236, 234, 231, .78);
  --bar: #f0efec;
  --fg: #1d1d1f;
  --muted: #86868b;
  --line: #dedcd7;
  --sel: #2f6fed;
  --sel-soft: #dce7fd;
  --link: #a87a00;
  --note-sel: #fae39f;
  --soft: #fdf3d4;
  --chip: #efece6;
  --menubar: rgba(250, 247, 244, .55);
  --menubar-fg: #1d1d1f;
  --menu: rgba(246, 245, 243, .86);
  --panel: rgba(246, 245, 243, .78);
  --tile: rgba(255, 255, 255, .7);
  --dock: rgba(255, 255, 255, .3);
  --dock-line: rgba(255, 255, 255, .45);
  --desk-label: #ffffff;
  --shadow: 0 24px 64px rgba(0, 0, 0, .3), 0 0 0 .5px rgba(0, 0, 0, .2);
  --cal-red: #f0453a;
  --h-sky1: #8db8e2; --h-sky2: #cfdcec; --h-sky3: #f7cfae; --h-sun: #fff3dc; --h-1: #9fb7c4; --h-2: #6f8f9c; --h-3: #4a6b7c; --h-4: #2e4a5d; --h-5: #1d3243; --h-star: rgba(255,255,255,0);
  --rb0: #f9d3b4; --rb1: #f2906b; --rb2: #d9496f; --rb3: #2a7d8f; --rb4: #1b2d5a; --rb5: #ffe7c7;
  --folder: #79c3f5; --folder-back: #58aee9; --folder-hi: #a8dafa;
  --red: #ff5f57; --yellow: #febc2e; --green: #28c840;
  --t-clinical: #ff5f57; --t-service: #ff9f0a; --t-research: #30c75a; --t-leadership: #2f8cff; --t-reflection: #b066e8;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, "Segoe UI", Roboto, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Rounded", "Helvetica Neue", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --win: #1e1e20; --win-2: #252527; --vib: rgba(40, 40, 44, .74); --bar: #2a2a2d; --fg: #f2f2f4; --muted: #9a9aa0; --line: #3a3a3e;
    --sel-soft: #233a66; --link: #eabb3a; --note-sel: #5e4a12; --soft: #3a3115; --chip: #2f2f33;
    --menubar: rgba(28, 28, 30, .5); --menubar-fg: #f5f5f7; --menu: rgba(40, 40, 43, .86); --panel: rgba(36, 36, 40, .78); --tile: rgba(255, 255, 255, .1);
    --dock: rgba(40, 40, 44, .38); --dock-line: rgba(255, 255, 255, .16);
    --shadow: 0 24px 64px rgba(0, 0, 0, .6), 0 0 0 .5px rgba(255, 255, 255, .16);
    --h-sky1: #0b1530; --h-sky2: #1b2650; --h-sky3: #4a3560; --h-sun: #c9b8ff; --h-1: #34406a; --h-2: #273257; --h-3: #1c2645; --h-4: #131b34; --h-5: #0b1124; --h-star: rgba(255,255,255,.85);
    --rb0: #3b2234; --rb1: #a4513f; --rb2: #8c2d52; --rb3: #17505d; --rb4: #0c1631; --rb5: #6b4033;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --win: #1e1e20; --win-2: #252527; --vib: rgba(40, 40, 44, .74); --bar: #2a2a2d; --fg: #f2f2f4; --muted: #9a9aa0; --line: #3a3a3e;
  --sel-soft: #233a66; --link: #eabb3a; --note-sel: #5e4a12; --soft: #3a3115; --chip: #2f2f33;
  --menubar: rgba(28, 28, 30, .5); --menubar-fg: #f5f5f7; --menu: rgba(40, 40, 43, .86); --panel: rgba(36, 36, 40, .78); --tile: rgba(255, 255, 255, .1);
  --dock: rgba(40, 40, 44, .38); --dock-line: rgba(255, 255, 255, .16);
  --shadow: 0 24px 64px rgba(0, 0, 0, .6), 0 0 0 .5px rgba(255, 255, 255, .16);
  --h-sky1: #0b1530; --h-sky2: #1b2650; --h-sky3: #4a3560; --h-sun: #c9b8ff; --h-1: #34406a; --h-2: #273257; --h-3: #1c2645; --h-4: #131b34; --h-5: #0b1124; --h-star: rgba(255,255,255,.85);
    --rb0: #3b2234; --rb1: #a4513f; --rb2: #8c2d52; --rb3: #17505d; --rb4: #0c1631; --rb5: #6b4033;
  color-scheme: dark;
}
html, body { height: 100%; }
body { font-family: var(--font); font-size: 13px; color: var(--fg); overflow: hidden; -webkit-font-smoothing: antialiased; background: var(--rb4); user-select: none; -webkit-user-select: none; }
.doc, .doc *, input { user-select: text; -webkit-user-select: text; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }

.screen { position: relative; height: 100%; overflow: hidden; }
.wall { position: absolute; inset: 0; }
.wall svg { width: 100%; height: 100%; display: block; }
.wall.dusk { background:
  radial-gradient(ellipse 70% 55% at 18% 12%, var(--rb5), transparent 60%),
  radial-gradient(ellipse 65% 60% at 85% 20%, var(--rb2), transparent 62%),
  radial-gradient(ellipse 80% 70% at 30% 85%, var(--rb3), transparent 65%),
  linear-gradient(160deg, var(--rb1), var(--rb4)); }
.wall.graphite { background: radial-gradient(ellipse 90% 80% at 30% 20%, #6e6e73, transparent 70%), linear-gradient(160deg, #3a3a3c, #121214); }
.wall.dusk svg, .wall.graphite svg { display: none; }
.wall .w-hills { display: none; }
.wall.hills .w-ribbons { display: none; }
.wall.hills .w-hills { display: block; }
.sw.hills { background: linear-gradient(180deg, #9fc4e8 0%, #f6c9a8 45%, #6f8f9c 46%, #3d5a6c 70%, #22374a); }

/* ---------- menu bar ---------- */
.menubar {
  position: absolute; inset: 0 0 auto 0; height: 26px; z-index: 10000; display: flex; align-items: center; gap: 1px;
  padding: 0 8px; background: var(--menubar); color: var(--menubar-fg);
  backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8);
}
.mb { border: 0; background: none; padding: 2px 9px; height: 22px; border-radius: 5px; cursor: default; font-size: 13px; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
.mb.open, .mb:active { background: rgba(127, 127, 127, .25); }
.mb.app { font-weight: 700; }
.mono { width: 15px; height: 15px; border-radius: 50%; background: var(--menubar-fg); color: var(--menubar); font-size: 7.5px; font-weight: 800; display: grid; place-items: center; }
.mb-right { margin-left: auto; display: flex; align-items: center; gap: 1px; }
.mb svg { width: 16px; height: 16px; display: block; }
.mb .pct { font-size: 12px; font-variant-numeric: tabular-nums; }
.clock { font-variant-numeric: tabular-nums; }

.dropdown {
  position: absolute; z-index: 25000; min-width: 230px; padding: 5px; border-radius: 9px;
  background: var(--menu); color: var(--fg); box-shadow: var(--shadow);
  backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6);
}
.dropdown button {
  display: flex; justify-content: space-between; align-items: center; gap: 24px; width: 100%; border: 0; background: none; text-align: left;
  padding: 3px 10px; border-radius: 5px; cursor: default; font-size: 13px; line-height: 1.45;
}
.dropdown button:hover:not(:disabled) { background: var(--sel); color: #fff; }
.dropdown button:disabled { color: var(--muted); }
.dropdown .k { color: var(--muted); font-size: 12.5px; }
.dropdown button:hover .k { color: inherit; }
.dropdown hr { border: 0; border-top: 1px solid var(--line); margin: 4px 10px; }
.dropdown .hd { font-size: 11.5px; color: var(--muted); font-weight: 600; padding: 4px 10px 2px; }
.dropdown .tagrow { display: flex; gap: 6px; padding: 5px 10px; }
.dropdown .tagrow .dot { width: 12px; height: 12px; }

/* ---------- desktop ---------- */
.desk { position: absolute; inset: 26px 0 0 0; }
.dicon {
  position: absolute; width: 92px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 4px; cursor: default; border-radius: 6px; touch-action: none;
}
.dicon .ic, .ficon .ic { width: 62px; height: 54px; display: grid; place-items: center; border-radius: 6px; padding: 2px; }
.dicon .ic svg, .ficon .ic svg { max-width: 100%; max-height: 100%; filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, .18)); }
.dicon .lb, .ficon .lb { font-size: 12px; line-height: 1.25; text-align: center; padding: 1px 5px; border-radius: 4px; max-width: 100%; overflow-wrap: break-word; hyphens: auto; }
.dicon .lb { color: var(--desk-label); text-shadow: 0 1px 2px rgba(0, 0, 0, .7); font-weight: 500; }
.dicon.sel .ic, .ficon.sel .ic { background: rgba(127, 127, 127, .3); }
.dicon.sel .lb, .ficon.sel .lb { background: var(--sel); color: #fff; text-shadow: none; }
.rubber { position: absolute; border: 1px solid rgba(160, 190, 255, .9); background: rgba(120, 160, 255, .2); z-index: 5; pointer-events: none; }

/* ---------- windows ---------- */
.win {
  position: absolute; display: flex; flex-direction: column; background: transparent; border-radius: 12px;
  box-shadow: var(--shadow); overflow: hidden; resize: both; min-width: 320px; min-height: 220px; max-width: 100%;
  transform-origin: 50% 50%;
}
.win.opening { animation: winIn .24s cubic-bezier(.2, .9, .3, 1); }
.win.closing { animation: winOut .16s ease-in forwards; pointer-events: none; }
@keyframes winIn { from { opacity: 0; transform: scale(.93); } }
@keyframes winOut { to { opacity: 0; transform: scale(.95); } }
.win.genie { transition: transform .38s cubic-bezier(.5, 0, .7, .4), opacity .38s ease-in; pointer-events: none; }
.win.maxed { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; border-radius: 0; resize: none; }
.bar {
  display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px 0 18px; background: var(--bar);
  border-bottom: 1px solid var(--line); flex: none; touch-action: none; position: relative;
}
.win.slim .bar { height: 30px; }
.win.slim .wtitle { text-align: center; padding-right: 64px; }
.lights { display: flex; gap: 8px; flex: none; }
.l { width: 12px; height: 12px; border-radius: 50%; border: 0; padding: 0; cursor: default; position: relative; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .15); }
.l.close { background: var(--red); } .l.min { background: var(--yellow); } .l.max { background: var(--green); }
.win:not(.active) .l { background: var(--line); }
.lights:hover .l { background-color: revert-layer; }
.lights:hover .l.close { background: var(--red); } .lights:hover .l.min { background: var(--yellow); } .lights:hover .l.max { background: var(--green); }
.lights:hover .l::after { position: absolute; inset: 0; display: grid; place-items: center; font-size: 9.5px; font-weight: 800; color: rgba(0, 0, 0, .55); line-height: 1; }
.lights:hover .close::after { content: "×"; } .lights:hover .min::after { content: "–"; } .lights:hover .max::after { content: "⤢"; font-size: 8px; }
.wtitle { font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.win:not(.active) .wtitle { color: var(--muted); }
.tools, .tools-r { display: flex; gap: 2px; flex: none; align-items: center; }
.tb { border: 0; background: none; min-width: 30px; height: 28px; border-radius: 7px; display: grid; place-items: center; cursor: default; color: var(--muted); padding: 0 6px; }
.tb:hover:not(:disabled) { background: rgba(127, 127, 127, .16); color: var(--fg); }
.tb:disabled { opacity: .35; }
.tb.on { background: rgba(127, 127, 127, .2); color: var(--fg); }
.tb svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.seg { display: flex; background: rgba(127, 127, 127, .12); border-radius: 7px; padding: 2px; }
.seg .tb { height: 24px; min-width: 28px; }
.fsearch { position: relative; }
.fsearch input { width: 150px; height: 28px; border: 1px solid var(--line); background: var(--win); color: var(--fg); border-radius: 7px; padding: 0 8px 0 26px; font: inherit; font-size: 13px; }
.fsearch svg { position: absolute; left: 8px; top: 7px; width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 1.8; }
.wbody { flex: 1; min-height: 0; display: flex; overflow: hidden; background: var(--win); }

/* finder */
.win.finder .wbody { background: transparent; }
.win.finder .bar { background: var(--win); }
.fside { width: 180px; flex: none; background: var(--vib); backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8); overflow-y: auto; padding: 8px 10px; border-right: 1px solid var(--line); }
.win.finder .fside { margin-top: -53px; padding-top: 58px; position: relative; z-index: 1; }
.win.finder .bar { padding-left: 196px; }
.win.finder .lights { position: absolute; left: 18px; top: 20px; z-index: 3; }
.fside h4 { font-size: 11px; color: var(--muted); font-weight: 700; margin: 12px 8px 3px; }
.fside h4:first-child { margin-top: 0; }
.si {
  display: flex; align-items: center; gap: 7px; width: 100%; border: 0; background: none; text-align: left;
  padding: 4px 8px; border-radius: 6px; cursor: default; font-size: 13px; white-space: nowrap; min-width: 0;
}
.si .t2 { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.si:hover { background: rgba(127, 127, 127, .12); }
.si.cur { background: rgba(127, 127, 127, .22); }
.si .g { width: 17px; flex: none; display: grid; place-items: center; color: var(--sel); }
.si .g svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.fwrap { flex: 1; min-width: 0; display: flex; position: relative; }
.win.finder .fwrap { margin-top: -53px; flex-direction: column; }
.win.finder .bar { position: relative; z-index: 2; }
.fmain { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--win); padding-top: 53px; }
.fgrid { flex: 1; overflow-y: auto; padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); align-content: start; gap: 4px; }
.ficon { width: auto; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 3px; cursor: default; border-radius: 6px; }
.ficon .dots { display: flex; gap: 3px; height: 8px; }
.ficon .dots .dot { width: 7px; height: 7px; }
.flist { flex: 1; overflow: auto; }
.flist table { width: 100%; border-collapse: collapse; font-size: 13px; }
.flist th { position: sticky; top: 0; background: var(--win); text-align: left; font-weight: 500; color: var(--muted); padding: 5px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.flist td { padding: 4px 10px; white-space: nowrap; }
.flist tr.row:nth-child(even) td { background: var(--win-2); }
.flist tr.row.sel td { background: var(--sel); color: #fff; }
.flist .nm { display: flex; align-items: center; gap: 8px; }
.mini { width: 18px; height: 16px; display: grid; place-items: center; flex: none; }
.mini svg { max-width: 100%; max-height: 100%; }
.empty-f { color: var(--muted); padding: 40px; text-align: center; grid-column: 1 / -1; }
.pathbar { border-top: 1px solid var(--line); padding: 4px 12px; font-size: 11.5px; color: var(--muted); display: flex; gap: 2px; align-items: center; overflow-x: auto; white-space: nowrap; flex: none; background: var(--win); }
.pathbar button { border: 0; background: none; padding: 1px 4px; border-radius: 4px; cursor: default; color: var(--fg); display: inline-flex; gap: 4px; align-items: center; }
.pathbar button:hover { background: rgba(127, 127, 127, .16); }
.pathbar .mini { width: 14px; height: 12px; }
.pathbar .cnt { margin-left: auto; padding-left: 12px; }

/* document */
.docwrap { flex: 1; overflow-y: auto; min-width: 0; background: var(--win); }
.doc { max-width: 700px; margin: 0 auto; padding: 22px 34px 70px; font-size: 14.5px; }
.doc .when { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 16px; }
.doc h1 { font-size: 25px; line-height: 1.2; margin: 0 0 12px; font-weight: 700; text-wrap: balance; letter-spacing: -.01em; }
.doc h2 { font-size: 17px; margin: 26px 0 8px; font-weight: 700; }
.doc h3 { font-size: 14.5px; margin: 18px 0 6px; font-weight: 700; }
.doc p { line-height: 1.6; margin: 0 0 12px; max-width: 65ch; }
.doc ul { padding-left: 20px; margin: 0 0 12px; line-height: 1.6; }
.doc a { color: var(--link); text-decoration: none; }
.doc a:hover { text-decoration: underline; }
.lnk { border: 0; background: none; padding: 0; color: var(--link); cursor: pointer; text-align: left; }
.lnk:hover { text-decoration: underline; }
.sub { color: var(--muted); font-size: 13px; }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
.tagline { display: flex; gap: 10px; flex-wrap: wrap; margin: -4px 0 14px; font-size: 12px; color: var(--muted); }
.tagline span { display: inline-flex; align-items: center; gap: 5px; }
.todo { color: var(--muted); font-style: italic; border-bottom: 1px dashed var(--muted); }
.hero { display: flex; gap: 18px; align-items: center; margin: 4px 0 16px; flex-wrap: wrap; }
.photo { width: 96px; height: 96px; border-radius: 50%; flex: none; display: grid; place-items: center; background: linear-gradient(160deg, #a1a1a6, #6e6e73); color: #fff; font-weight: 600; font-size: 34px; font-family: var(--font-display); }
.hero .who { min-width: 0; flex: 1; }
.hero .name { font-size: 19px; font-weight: 700; }
.hero .line { color: var(--muted); font-size: 13.5px; line-height: 1.5; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 4px 0 12px; font-size: 14px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; min-width: 0; }
.explore { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 8px 0 14px; }
.explore button { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--win-2); border-radius: 8px; padding: 8px 10px; text-align: left; cursor: pointer; font-size: 13px; min-width: 0; }
.explore button:hover { border-color: var(--sel); }
.explore .mi { width: 22px; height: 19px; flex: none; display: grid; place-items: center; }
.explore .mi svg { max-width: 100%; max-height: 100%; }
.tbl { overflow-x: auto; margin: 6px 0 14px; border: 1px solid var(--line); border-radius: 8px; }
.doc table { border-collapse: collapse; width: 100%; font-size: 13px; }
.doc th, .doc td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; line-height: 1.45; }
.doc th:last-child, .doc td:last-child { border-right: 0; }
.doc tr:last-child td, .doc tr:last-child th { border-bottom: 0; }
.doc th { font-weight: 600; background: var(--win-2); white-space: nowrap; }
.doc td.n { font-variant-numeric: tabular-nums; text-align: center; white-space: nowrap; }
.doc td.blank { color: var(--muted); font-style: italic; text-align: center; }
.doc table.kv th { width: 34%; white-space: normal; }
.checks { list-style: none; padding: 0 !important; }
.checks li { display: flex; gap: 10px; align-items: flex-start; padding: 4px 0; }
.box { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; margin-top: 2px; display: grid; place-items: center; }
.checks li.done .box { background: var(--link); border-color: var(--link); }
.checks li.done .box::after { content: ""; width: 5px; height: 9px; border: solid var(--win); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
.checks li.done .txt { color: var(--muted); text-decoration: line-through; }
.checks .txt { line-height: 1.5; min-width: 0; }
.meter { margin: 8px 0 16px; display: grid; gap: 10px; }
.meter .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: 13.5px; }
.meter .bar2 { grid-column: 1 / -1; height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.meter .bar2 i { display: block; height: 100%; background: var(--link); border-radius: 3px; }
.meter .val { color: var(--muted); font-variant-numeric: tabular-nums; }
.prompts { background: var(--soft); border-radius: 8px; padding: 12px 16px; margin: 8px 0 14px; font-size: 14px; }
.prompts ol { margin: 6px 0 0; padding-left: 20px; line-height: 1.55; }
.prompts .lbl { font-size: 11px; font-weight: 700; color: var(--link); letter-spacing: .05em; text-transform: uppercase; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }
.chips span { background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; }

/* preview, about, info */
.preview { flex: 1; display: grid; place-items: center; background: var(--win-2); padding: 20px; text-align: center; }
.preview .photo { width: 160px; height: 160px; font-size: 56px; margin: 0 auto 14px; }
.aboutmac { flex: 1; overflow-y: auto; padding: 18px 26px 24px; text-align: center; background: var(--win); }
.aboutmac .photo { width: 104px; height: 104px; margin: 4px auto 14px; font-size: 38px; }
.aboutmac h2 { margin: 0; font-size: 24px; font-weight: 700; font-family: var(--font-display); }
.aboutmac .ver { color: var(--muted); margin: 2px 0 16px; font-size: 12px; }
.aboutmac dl { display: grid; grid-template-columns: max-content 1fr; gap: 5px 12px; text-align: left; font-size: 12px; margin: 0 auto 18px; max-width: 280px; }
.aboutmac dt { text-align: right; font-weight: 600; } .aboutmac dd { margin: 0; color: var(--muted); }
.pill-btn { border: 1px solid var(--line); background: var(--win); border-radius: 6px; padding: 3px 14px; cursor: default; box-shadow: 0 1px 1px rgba(0, 0, 0, .06); }
.pill-btn:hover { border-color: var(--sel); }
.pill-btn.blue { background: var(--sel); color: #fff; border-color: var(--sel); }
.info { flex: 1; overflow-y: auto; padding: 14px 16px; background: var(--win); font-size: 12px; }
.info .top { display: flex; gap: 10px; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.info .top .mi { width: 44px; height: 40px; }
.info .top b { font-size: 13px; display: block; }
.info h5 { margin: 12px 0 6px; font-size: 12px; }
.info dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; margin: 0; }
.info dt { color: var(--muted); text-align: right; } .info dd { margin: 0; overflow-wrap: anywhere; }

/* quick look */
.ql { position: absolute; inset: 0; z-index: 21000; display: grid; place-items: center; padding: 40px 16px 90px; }
.ql-box { width: min(720px, 100%); height: min(600px, 100%); background: var(--win); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; animation: winIn .2s cubic-bezier(.2, .9, .3, 1); }
.ql-bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--bar); border-bottom: 1px solid var(--line); }
.ql-bar .x { border: 0; background: rgba(127, 127, 127, .18); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; cursor: default; font-size: 14px; line-height: 1; }
.ql-bar .tt { flex: 1; text-align: center; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ql-box .docwrap { flex: 1; }

/* notes app */
.notes { flex: 1; display: grid; grid-template-columns: 170px 240px minmax(0, 1fr); min-width: 0; }
.nfold { background: var(--vib); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 8px; }
.nfold h4 { font-size: 11px; color: var(--muted); margin: 0 8px 4px; font-weight: 700; }
.nfold .si .g { color: var(--link); }
.nlist { border-right: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; min-width: 0; background: var(--win); }
.nsearch { padding: 8px; border-bottom: 1px solid var(--line); }
.nsearch input { width: 100%; border: 1px solid var(--line); background: var(--win); color: var(--fg); border-radius: 6px; padding: 5px 8px; font: inherit; }
.nitem { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 9px 12px; cursor: default; border-radius: 7px; margin: 1px 6px; width: calc(100% - 12px); }
.nitem.cur { background: var(--note-sel); }
.nitem .t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nitem .p { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.nitem .p b { color: var(--fg); font-weight: 500; margin-right: 5px; }
.nnote { overflow-y: auto; min-width: 0; background: var(--win); }
.nback { display: none; }

/* calendar */
.cal { flex: 1; display: grid; grid-template-columns: 220px minmax(0, 1fr); min-width: 0; }
.cal-side { background: var(--vib); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border-right: 1px solid var(--line); padding: 14px; overflow-y: auto; }
.cal-side h4 { margin: 0 0 8px; font-size: 11px; color: var(--muted); font-weight: 700; }
.ev { display: grid; grid-template-columns: 3px 1fr; gap: 8px; margin-bottom: 10px; font-size: 12px; line-height: 1.4; }
.ev i { border-radius: 2px; background: var(--cal-red); }
.ev.blue i { background: var(--t-leadership); } .ev.orange i { background: var(--t-service); }
.ev .d { color: var(--muted); }
.cal-main { display: flex; flex-direction: column; min-width: 0; background: var(--win); }
.cal-head { display: flex; align-items: baseline; gap: 6px; padding: 10px 16px; }
.cal-head h3 { margin: 0; font-size: 24px; font-weight: 700; font-family: var(--font-display); }
.cal-head h3 span { font-weight: 400; }
.cal-head .nav { margin-left: auto; display: flex; gap: 4px; }
.cal-grid { flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: minmax(64px, 1fr); border-top: 1px solid var(--line); overflow-y: auto; }
.cal-dow { font-size: 11px; color: var(--muted); text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--line); }
.cal-day { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 6px; font-size: 12px; min-width: 0; }
.cal-day:nth-child(7n) { border-right: 0; }
.cal-day .num { text-align: right; font-variant-numeric: tabular-nums; }
.cal-day.out .num { color: var(--muted); opacity: .6; }
.cal-day.today .num span { background: var(--cal-red); color: #fff; border-radius: 999px; padding: 1px 6px; }
.cal-day .chipev { display: block; margin-top: 3px; font-size: 11px; padding: 1px 5px; border-radius: 4px; background: rgba(240, 69, 58, .16); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 2px solid var(--cal-red); }

/* settings */
.set { flex: 1; display: grid; grid-template-columns: 210px minmax(0, 1fr); min-width: 0; }
.set-side { background: var(--vib); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border-right: 1px solid var(--line); padding: 10px 8px; overflow-y: auto; }
.set-side .me { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 8px; margin-bottom: 8px; width: 100%; border: 0; background: none; text-align: left; cursor: default; }
.set-side .me .photo { width: 38px; height: 38px; font-size: 14px; }
.set-side .me b { display: block; font-size: 13px; } .set-side .me span { font-size: 11px; color: var(--muted); }
.sico { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; flex: none; color: #fff; }
.sico svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.set-main { overflow-y: auto; padding: 18px 24px; background: var(--win); }
.set-main h2 { margin: 0 0 14px; font-size: 18px; }
.group { background: var(--win-2); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; }
.group .r { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
.group .r:last-child { border-bottom: 0; }
.group .r span:last-child { color: var(--muted); text-align: right; }
.choices { display: flex; gap: 16px; flex-wrap: wrap; padding: 14px; }
.choice { border: 0; background: none; cursor: default; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; }
.choice .sw { width: 92px; height: 60px; border-radius: 8px; border: 3px solid transparent; box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.choice.on .sw { border-color: var(--sel); }
.sw.light { background: linear-gradient(#f5f5f7 0 22%, #ffffff 22%); }
.sw.dark { background: linear-gradient(#2c2c2e 0 22%, #1c1c1e 22%); }
.sw.auto { background: linear-gradient(90deg, #ffffff 50%, #1c1c1e 50%); }
.sw.ribbons { background: linear-gradient(160deg, #f9d3b4, #f2906b 35%, #d9496f 55%, #2a7d8f 75%, #1b2d5a); }
.sw.dusk { background: radial-gradient(circle at 20% 15%, #ffe7c7, transparent 50%), linear-gradient(160deg, #f2906b, #1b2d5a); }
.sw.graphite { background: linear-gradient(160deg, #6e6e73, #121214); }

/* spotlight */
.spot { position: absolute; inset: 0; z-index: 22000; display: flex; justify-content: center; align-items: flex-start; padding: 18vh 16px 0; }
.spot-box { width: 100%; max-width: 640px; background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8); animation: winIn .16s ease-out; }
.spot-in { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
.spot-in svg { width: 22px; height: 22px; stroke: var(--muted); fill: none; stroke-width: 2; flex: none; }
.spot-in input { flex: 1; border: 0; background: none; font: inherit; font-size: 22px; color: var(--fg); outline: none; min-width: 0; font-weight: 300; }
.spot-res { border-top: 1px solid var(--line); max-height: 48vh; overflow-y: auto; padding: 4px 6px 6px; }
.spot-res:empty { display: none; }
.spot-res .hd { font-size: 11px; font-weight: 700; color: var(--muted); padding: 6px 10px 2px; }
.sr { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 5px 10px; border-radius: 7px; text-align: left; cursor: default; }
.sr .mi { width: 24px; height: 22px; display: grid; place-items: center; flex: none; }
.sr .mi svg { max-width: 100%; max-height: 100%; }
.sr .w { min-width: 0; flex: 1; }
.sr .w div:last-child { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sr.on { background: var(--sel); color: #fff; }
.sr.on .w div:last-child { color: rgba(255, 255, 255, .8); }

/* control center + notification center + banners */
.cc { position: absolute; top: 31px; right: 8px; z-index: 24000; width: 320px; max-width: calc(100% - 16px); padding: 10px; border-radius: 16px; background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; animation: winIn .16s ease-out; }
.cc .tile { background: var(--tile); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.cc .wide { grid-column: 1 / -1; }
.cc .tg { display: flex; gap: 8px; align-items: center; border: 0; background: none; padding: 0; text-align: left; cursor: default; }
.cc .tg .c { width: 28px; height: 28px; border-radius: 50%; background: var(--sel); display: grid; place-items: center; flex: none; }
.cc .tg.off .c { background: rgba(127, 127, 127, .3); }
.cc .tg .c svg { width: 15px; height: 15px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; }
.cc .tg b { display: block; font-size: 12px; } .cc .tg span { font-size: 11px; color: var(--muted); }
.cc label { font-size: 12px; font-weight: 600; }
.cc input[type=range] { width: 100%; accent-color: #ffffff; }
.cc .segs { display: flex; gap: 4px; }
.cc .segs button { flex: 1; border: 0; border-radius: 7px; padding: 5px; background: rgba(127, 127, 127, .15); cursor: default; font-size: 12px; }
.cc .segs button.on { background: var(--sel); color: #fff; }
.ncenter { position: absolute; top: 26px; right: 0; bottom: 0; width: 360px; max-width: 100%; z-index: 24000; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; animation: slideIn .25s cubic-bezier(.2, .9, .3, 1); }
@keyframes slideIn { from { transform: translateX(40px); opacity: 0; } }
.card { background: var(--panel); border-radius: 16px; padding: 12px 14px; box-shadow: 0 6px 20px rgba(0, 0, 0, .18); backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8); color: var(--fg); }
.card .h { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.card .h .ai { width: 18px; height: 18px; border-radius: 5px; overflow: hidden; }
.card .h .ai svg { width: 100%; height: 100%; display: block; }
.card .h .tm { margin-left: auto; }
.card b { font-size: 13px; display: block; }
.card p { margin: 2px 0 0; font-size: 12.5px; line-height: 1.4; }
.card.clickable { cursor: default; text-align: left; border: 0; width: 100%; font: inherit; color: inherit; }
.wcal { display: grid; grid-template-columns: auto 1fr; gap: 14px; }
.wcal .big .dw { color: var(--cal-red); font-size: 12px; font-weight: 700; text-transform: uppercase; }
.wcal .big .dn { font-size: 40px; font-weight: 300; line-height: 1; font-family: var(--font-display); }
.wprog { display: grid; gap: 8px; margin-top: 6px; }
.wprog .row { font-size: 12px; display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; }
.wprog .bar3 { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: rgba(127, 127, 127, .2); overflow: hidden; }
.wprog .bar3 i { display: block; height: 100%; background: var(--sel); }
.banners { position: absolute; top: 34px; right: 10px; z-index: 23000; display: flex; flex-direction: column; gap: 8px; width: 350px; max-width: calc(100% - 20px); }
.banners .card { animation: slideIn .35s cubic-bezier(.2, .9, .3, 1); }
.banners .card.out { transition: transform .3s ease-in, opacity .3s; transform: translateX(380px); opacity: 0; }

/* dock */
.dock {
  position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); z-index: 9000; display: flex; align-items: flex-end; gap: 4px;
  padding: 5px 6px 4px; border-radius: 20px; background: var(--dock); border: 1px solid var(--dock-line);
  backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6); max-width: calc(100% - 16px);
}
.dk { position: relative; border: 0; background: none; padding: 0 1px; cursor: default; display: flex; flex-direction: column; align-items: center; }
.dk .app-ic { width: 52px; height: 52px; display: grid; place-items: center; transition: width .18s ease, height .18s ease; }
.dock.mag .dk .app-ic { transition: none; }
.dk .app-ic > svg, .dk .app-ic > .sq { width: 100%; height: 100%; display: block; border-radius: 23%; overflow: hidden; box-shadow: 0 2px 5px rgba(0, 0, 0, .25); }
.dk.trash .app-ic > svg { box-shadow: none; border-radius: 0; }
.dk .run { width: 4px; height: 4px; border-radius: 50%; background: var(--menubar-fg); margin-top: 2px; opacity: 0; }
.dk.running .run { opacity: .75; }
.dk.bounce .app-ic { animation: bounce .55s cubic-bezier(.3, 0, .5, 1) 2; }
@keyframes bounce { 50% { transform: translateY(-20px); } }
.dk .tip { position: absolute; bottom: calc(100% + 14px); left: 50%; transform: translateX(-50%); background: var(--menu); color: var(--fg); padding: 3px 10px; border-radius: 6px; font-size: 12.5px; white-space: nowrap; box-shadow: var(--shadow); opacity: 0; pointer-events: none; backdrop-filter: blur(20px); }
.dk:hover .tip { opacity: 1; }
.dock-sep { width: 1px; align-self: stretch; background: var(--dock-line); margin: 6px 4px 10px; }
.sq.minw { background: var(--win); display: grid; place-items: center; font-size: 24px; }

/* lock screen */
.lock { position: absolute; inset: 0; z-index: 30000; display: flex; flex-direction: column; align-items: center; color: #fff; backdrop-filter: blur(30px) saturate(1.3); -webkit-backdrop-filter: blur(30px) saturate(1.3); background: rgba(0, 0, 0, .12); cursor: default; transition: opacity .45s ease, transform .45s ease; }
.lock.gone { opacity: 0; transform: scale(1.04); pointer-events: none; }
.lock .ld { margin-top: 8vh; font-size: clamp(16px, 2.2vw, 24px); font-weight: 600; opacity: .9; text-shadow: 0 1px 8px rgba(0, 0, 0, .25); }
.lock .lt { font-family: var(--font-display); font-size: clamp(76px, 15vw, 150px); font-weight: 700; line-height: 1; letter-spacing: -.02em; opacity: .92; text-shadow: 0 2px 20px rgba(0, 0, 0, .25); font-variant-numeric: tabular-nums; }
.lock .lu { margin-top: auto; margin-bottom: 9vh; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.lock .lu .photo { width: 64px; height: 64px; font-size: 22px; box-shadow: 0 4px 16px rgba(0, 0, 0, .3); }
.lock .lu b { font-size: 15px; text-shadow: 0 1px 6px rgba(0, 0, 0, .3); }
.lock .lu button { border: 0; background: rgba(255, 255, 255, .22); color: #fff; padding: 6px 16px; border-radius: 999px; font-size: 12.5px; cursor: default; backdrop-filter: blur(10px); }
.lock .lu button:hover { background: rgba(255, 255, 255, .32); }
.lock .lu .hint { font-size: 11.5px; opacity: .75; }
.screen.locked .menubar, .screen.locked .desk, .screen.locked .dock { visibility: hidden; }

@media (max-width: 720px) {
  .mb.hide-sm { display: none; }
  .win { left: 0 !important; top: 0 !important; width: 100% !important; height: calc(100% - 74px) !important; border-radius: 0; resize: none; min-width: 0; }
  .lights .min, .lights .max { display: none; }
  .fside { display: none; }
  .win.finder .bar { padding-left: 52px; }
  .fsearch input { width: 100px; }
  .doc { padding: 16px 16px 60px; }
  .notes { grid-template-columns: minmax(0, 1fr); }
  .nfold { display: none; }
  .notes.reading .nlist { display: none; }
  .notes:not(.reading) .nnote { display: none; }
  .nback { display: block; border: 0; background: none; color: var(--link); padding: 10px 16px 0; font-size: 15px; }
  .cal, .set { grid-template-columns: minmax(0, 1fr); }
  .cal-side { display: none; }
  .set-side { display: none; }
  .dk .app-ic { width: 42px !important; height: 42px !important; }
  .dk .tip { display: none; }
  .dicon { width: 84px; }
}
@media (prefers-reduced-motion: reduce) {
  .win.opening, .win.closing, .dk.bounce .app-ic, .ncenter, .banners .card, .spot-box, .cc, .ql-box { animation: none !important; }
  .win.genie, .lock { transition: none !important; }
}

/* ================= Notes app (portfolio editor) ================= */
:root {
  --n-rail: #f4f5f1; --n-paper: #fdfdfb; --n-ink: #1c2422; --n-muted: #66706c; --n-line: #dfe2dc;
  --n-accent: #0d6b62; --n-accent-soft: #d9ece8; --n-accent-ink: #ffffff; --n-ok: #2f7a3d; --n-ok-soft: #e1f0e2; --n-warn: #9a5b00; --n-warn-soft: #f7ead2;
  --n-r1: #e8eeec; --n-r2: #c9e2dd; --n-r3: #8cc5bb; --n-r4: #0d6b62; --n-r-ink: #1c2422; --n-r4-ink: #ffffff;
  --n-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --n-ui: "Figtree", -apple-system, system-ui, "Segoe UI", sans-serif;
  --n-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --n-rail: #171c1b; --n-paper: #1b2120; --n-ink: #e7ecea; --n-muted: #9aa5a1; --n-line: #2c3433;
  --n-accent: #62c6b8; --n-accent-soft: #1d3a36; --n-accent-ink: #0b1d1a; --n-ok: #7fcf8c; --n-ok-soft: #1f3423; --n-warn: #e9b45e; --n-warn-soft: #3a2c14;
  --n-r1: #243230; --n-r2: #2c4a45; --n-r3: #3f7d73; --n-r4: #62c6b8; --n-r-ink: #e7ecea; --n-r4-ink: #0b1d1a; } }
:root[data-theme="dark"] {
  --n-rail: #171c1b; --n-paper: #1b2120; --n-ink: #e7ecea; --n-muted: #9aa5a1; --n-line: #2c3433;
  --n-accent: #62c6b8; --n-accent-soft: #1d3a36; --n-accent-ink: #0b1d1a; --n-ok: #7fcf8c; --n-ok-soft: #1f3423; --n-warn: #e9b45e; --n-warn-soft: #3a2c14;
  --n-r1: #243230; --n-r2: #2c4a45; --n-r3: #3f7d73; --n-r4: #62c6b8; --n-r-ink: #e7ecea; --n-r4-ink: #0b1d1a; }

.win.notesapp .bar { background: var(--n-rail); }
.win.notesapp .wbody { background: var(--n-paper); }
.pn { flex: 1; display: grid; grid-template-columns: minmax(230px, 290px) minmax(0, 1fr); min-width: 0; min-height: 0; background: var(--n-paper); color: var(--n-ink); font-family: var(--n-ui); font-size: 15px; line-height: 1.55; }
.pn button { cursor: pointer; }
.pn :focus-visible { outline: 2px solid var(--n-accent); outline-offset: 2px; border-radius: 4px; }

function finderSelect(win, id) { win.state.sel = id; win.el.querySelectorAll("[data-item]").forEach(x => x.classList.toggle("sel", x.dataset.item === id)); }

      if (act === "icons" || act === "list") s.view = act;
      if (act === "tagmenu") { const r = a.getBoundingClientRect(); showMenuAt(r.left, r.bottom + 4, Object.entries(TAGS).map(([t, [nm]]) => [nm, () => navigate(win, "tag:" + t)])); return; }
      renderFinder(win); return;

    const l = e.target.closest("[data-loc]"); if (l) { navigate(win, l.dataset.loc); return; }
    const it = e.target.closest("[data-item]");
    if (it) { if (coarse()) openItem(it.dataset.item, win); else finderSelect(win, it.dataset.item); return; }
    if (e.target.closest(".fgrid, .flist")) finderSelect(win, null);

  el.addEventListener("input", e => { if (e.target.dataset.fq) { s.q = e.target.value.trim(); s.sel = null; renderFinder(win); } });
  el.addEventListener("contextmenu", e => { const it = e.target.closest("[data-item]"); if (!it) return; e.preventDefault(); finderSelect(win, it.dataset.item); fileMenu(e.clientX, e.clientY, it.dataset.item, win); });
}
function goBack(win) { const s = win.state; if (s.q) s.q = ""; else if (s.idx > 0) { s.idx--; s.loc = s.hist[s.idx]; s.sel = null; } renderFinder(win); }

function quickLook(id) {

    const saveCur = Notes.current;
    const art = (() => { const prevE = EDIT, prevC = Notes.computed; EDIT = false; Notes.computed = []; const nn = NOTE_LIST.find(x => x.id === n.sec); const head = (n.sec === "about" || n.sec === "tracker") ? [] : [h("div", { class: "note-head" }, h("span", { class: "eyebrow" }, nn.label), h("h1", {}, nn.title))]; const a = h("article", { class: "note" }, ...head, ...R[n.sec]()); EDIT = prevE; Notes.computed = prevC; return a; })();
    Notes.current = saveCur;

}

/* calendar */
function calEvents() {
  const ev = [];
  state.shadowing.log.forEach(r => { const d = parseD(r.date); if (d) ev.push({ d, t: `Shadowing · ${r.physician || r.specialty || "session"}${r.hours ? ` (${fmtH(num(r.hours))}h)` : ""}`, c: "red", sec: "shadowing", a: "2A" }); });
  state.service.log.forEach(r => { const d = parseD(r.start); if (d) ev.push({ d, t: `Service · ${r.org || r.role || "entry"}${r.hours ? ` (${fmtH(num(r.hours))}h)` : ""}`, c: "orange", sec: "service", a: "3A" }); });
  state.leadership.events.forEach(r => { const d = parseD(r.date); if (d) ev.push({ d, t: r.event || "Event", c: "blue", sec: "leadership", a: "5B" }); });
  state.leadership.meetings.forEach(r => { const d = parseD(r.date); if (d) ev.push({ d, t: `PM meeting${r.pm ? " · " + r.pm : ""}`, c: "blue", sec: "leadership", a: "5C" }); });
  ev.push({ d: logsDate(), t: "Logs current through today", c: "red", sec: "tracker", dl: true });
  ev.push({ d: dueDate(), t: "JSP portfolio due", c: "red", sec: "tracker", dl: true });
  return ev;
}
function openCalendar() { const now = new Date(); return openWin("calendar", { app: "Calendar", dockId: "calendar", w: 920, h: 580, state: { y: now.getFullYear(), m: now.getMonth() }, render: renderCalendar }); }
function renderCalendar(win) {
  const s = win.state; setTitle(win, "");
  const first = new Date(s.y, s.m, 1), start = new Date(s.y, s.m, 1 - first.getDay());
  const today = new Date(), tkey = today.toDateString();
  const evs = calEvents(), byDay = {};
  evs.forEach((e, i) => { (byDay[keyOf(e.d)] = byDay[keyOf(e.d)] || []).push(i); });
  win.el.querySelector(".tools-r").innerHTML = `<div class="seg"><button class="tb" disabled>Day</button><button class="tb" disabled>Week</button><button class="tb on">Month</button><button class="tb" disabled>Year</button></div>`;
  let cells = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(d => `<div class="cal-dow">${d}</div>`).join("");
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const list = (byDay[keyOf(d)] || []);
    cells += `<div class="cal-day ${d.getMonth() !== s.m ? "out" : ""} ${d.toDateString() === tkey ? "today" : ""}"><div class="num"><span>${d.getDate() === 1 ? d.toLocaleDateString("en-US", { month: "short" }) + " " : ""}${d.getDate()}</span></div>${list.map(j => `<button class="chipev" data-ev="${j}" title="${esc(evs[j].t)}">${esc(evs[j].t)}</button>`).join("")}</div>`;
  }
  const t0 = new Date(today.toDateString());
  const up = evs.filter(e => e.d >= t0).sort((a, b) => a.d - b.d).slice(0, 6).map(e => `<div class="ev ${e.c}"><i></i><div><b>${esc(e.t)}</b><div class="d">${e.d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" })}</div></div></div>`).join("");
  const m = metrics();
  win.el.querySelector(".wbody").innerHTML = `<div class="cal"><aside class="cal-side"><h4>Up Next</h4>${up || '<div class="sub">Nothing scheduled</div>'}
    <h4 style="margin-top:14px">This Year</h4><div class="ev orange"><i></i><div><b>${fmtH(m.shThis)} shadowing hrs</b><div class="d">${fmtH(m.svThis)} service hrs</div></div></div>
    <h4 style="margin-top:14px">Calendars</h4><div class="ev"><i></i><div>Shadowing &amp; deadlines</div></div><div class="ev orange"><i></i><div>Service</div></div><div class="ev blue"><i></i><div>Events &amp; meetings</div></div></aside>
    <div class="cal-main"><div class="cal-head"><h3>${first.toLocaleDateString("en-US", { month: "long" })} <span>${s.y}</span></h3><div class="nav"><button class="tb" data-cal="-1" aria-label="Previous month">${G.chevL}</button><button class="pill-btn" data-cal="0">Today</button><button class="tb" data-cal="1" aria-label="Next month">${G.chevR}</button></div></div><div class="cal-grid">${cells}</div></div></div>`;
  win.evs = evs;
  if (!win.wired) {
    win.wired = true;
    win.el.addEventListener("click", e => {
      const ev = e.target.closest("[data-ev]"); if (ev) { const x = win.evs[+ev.dataset.ev]; openNotes(x.sec, x.a); return; }
      const b = e.target.closest("[data-cal]"); if (!b) return;
      const v = +b.dataset.cal;
      if (v === 0) { const n = new Date(); s.y = n.getFullYear(); s.m = n.getMonth(); } else { s.m += v; if (s.m < 0) { s.m = 11; s.y--; } if (s.m > 11) { s.m = 0; s.y++; } }
      renderCalendar(win);
    });
  }
}

/* ================= desktop icons ================= */
const deskPos = {};
let deskSel = new Set();
function layoutDesk() { const W = desk.clientWidth; DESK_ITEMS.forEach((id, i) => { if (deskPos[id] && deskPos[id].moved) return; deskPos[id] = isPhone() ? { x: 12 + (i % 4) * 88, y: 14 + Math.floor(i / 4) * 100 } : { x: W - 108, y: 12 + i * 102 }; }); }
function renderDesk() {
  layoutDesk();
  desk.querySelectorAll(".dicon").forEach(n => n.remove());
  DESK_ITEMS.forEach(id => {
    const b = document.createElement("button");
    b.className = "dicon" + (deskSel.has(id) ? " sel" : ""); b.dataset.d = id;
    b.style.left = deskPos[id].x + "px"; b.style.top = deskPos[id].y + "px";
    b.innerHTML = `<span class="ic">${iconFor(id)}</span><span class="lb">${esc(FS[id].name)}</span>`;
    desk.insertBefore(b, desk.firstChild);
  });
}
function paintDeskSel() { desk.querySelectorAll(".dicon").forEach(b => b.classList.toggle("sel", deskSel.has(b.dataset.d))); }
desk.addEventListener("pointerdown", e => {
  if (e.button !== 0 || e.target.closest(".win")) return;
  const icon = e.target.closest(".dicon"), dr = desk.getBoundingClientRect();
  if (icon) {
    const id = icon.dataset.d;
    if (!deskSel.has(id)) { deskSel = e.shiftKey || e.metaKey ? new Set([...deskSel, id]) : new Set([id]); paintDeskSel(); }
    if (coarse()) return;
    const sx = e.clientX, sy = e.clientY, starts = [...deskSel].map(k => [k, { ...deskPos[k] }]);
    let moved = false;
    const mv = ev => { const dx = ev.clientX - sx, dy = ev.clientY - sy; if (!moved && Math.hypot(dx, dy) < 4) return; moved = true;
      starts.forEach(([k, p]) => { deskPos[k] = { x: Math.max(0, Math.min(p.x + dx, desk.clientWidth - 92)), y: Math.max(0, Math.min(p.y + dy, desk.clientHeight - 110)), moved: true }; const b = desk.querySelector(`[data-d="${k}"]`); b.style.left = deskPos[k].x + "px"; b.style.top = deskPos[k].y + "px"; }); };
    const up = () => { window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", up); };
    window.addEventListener("pointermove", mv); window.addEventListener("pointerup", up);
    return;
  }
  deskSel = new Set(); paintDeskSel();
  if (coarse()) return;
  const ox = e.clientX - dr.left, oy = e.clientY - dr.top;
  const rb = document.createElement("div"); rb.className = "rubber"; desk.appendChild(rb);
  const mv = ev => { const x = ev.clientX - dr.left, y = ev.clientY - dr.top; const l = Math.min(ox, x), t = Math.min(oy, y), w = Math.abs(x - ox), hh = Math.abs(y - oy);
    Object.assign(rb.style, { left: l + "px", top: t + "px", width: w + "px", height: hh + "px" });
    deskSel = new Set(DESK_ITEMS.filter(id => { const p = deskPos[id]; return p.x < l + w && p.x + 92 > l && p.y < t + hh && p.y + 90 > t; })); paintDeskSel(); };
  const up = () => { rb.remove(); window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", up); };
  window.addEventListener("pointermove", mv); window.addEventListener("pointerup", up);
});
desk.addEventListener("click", e => { const d = e.target.closest(".dicon"); if (d && coarse()) openItem(d.dataset.d); });
desk.addEventListener("dblclick", e => { const d = e.target.closest(".dicon"); if (d) openItem(d.dataset.d); });
desk.addEventListener("contextmenu", e => {
  if (e.target.closest(".win")) return;
  e.preventDefault();
  const d = e.target.closest(".dicon");
  if (d) { deskSel = new Set([d.dataset.d]); paintDeskSel(); fileMenu(e.clientX, e.clientY, d.dataset.d); return; }

    try { const dl = await claude.use("downloads"); if (!dl) throw { code: "unavailable" }; await dl.save({ filename: "index.html", data: html }); Store.msg = "Exported index.html"; }
    catch (e) { if (!e || e.code !== "declined") Store.msg = "Download isn't available in this view"; }
    updateStatus(); setTimeout(() => { Store.msg = ""; updateStatus(); }, 4000); return;
  }
  const blob = new Blob([html], { type: "text/html" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "index.html";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  Store.exportedAt = Date.now(); try { localStorage.setItem("rr-exported", String(Store.exportedAt)); } catch (e) {}
  updateStatus();
}

/* ================= start ================= */
renderDock();
Store.init();
const startHash = (location.hash || "").slice(1);
let wasUnlocked = false; try { wasUnlocked = sessionStorage.getItem("rr-unlocked") === "1"; } catch (e) {}
if (FS[startHash]) { $("lock").classList.add("gone"); screen.classList.remove("locked"); booted = true; boot(startHash); }
else if (wasUnlocked) { $("lock").classList.add("gone"); screen.classList.remove("locked"); booted = true; boot(); }
else $("lock").focus({ preventScroll: true });

</script>
</body>
